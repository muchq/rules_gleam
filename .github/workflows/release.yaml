# Cut a release whenever a new tag is pushed to the repo.
# Releases are not published to BCR; dispatch publish.yaml by hand when that changes.
name: Release
on:
  # Can be triggered from the tag.yaml workflow
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  # Or, developers can manually push a tag from their clone
  push:
    tags:
      - "v*.*.*"
permissions:
  id-token: write
  attestations: write
  contents: write
jobs:
  release:
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      bazel_test_command: "bazel test --test_output=errors //..."
      release_files: rules_gleam-*.tar.gz
      prerelease: ${{ contains(inputs.tag_name || github.ref_name, '-') }}
      tag_name: ${{ inputs.tag_name || github.ref_name }}
