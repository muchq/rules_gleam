name: CI
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  test:
    name: Test (OS ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Erlang (Linux)
        if: runner.os == 'Linux'
        run: |
          # Erlang is hermetic by default now, so most examples download their own OTP release
          # and never touch this. Only examples/nested_smoke opts out via
          # gleam.local_erlang_toolchain(), so it still needs a system Erlang on PATH.
          echo "Installing Erlang..."
          # Update package lists to avoid 404 errors for outdated packages
          sudo apt-get update -y
          # Install Erlang with --fix-missing to handle potential fetch errors
          sudo apt-get install -y --fix-missing erlang
      - name: Set up Erlang (macOS)
        if: runner.os == 'macOS'
        run: |
          # Same rationale as the Linux step above (only examples/nested_smoke needs this).
          echo "Installing Erlang..."
          brew install erlang
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        # No version-related input: this action's valid inputs are bazelisk-version (which
        # Bazel version *fetching tool* to install, not which Bazel itself) plus cache/output
        # knobs -- it has no "version" input despite a previous revision of this file passing
        # one (silently ignored with an "Unexpected input(s)" warning every run). The actual
        # Bazel version is resolved by Bazelisk from .bazelversion at the repo root, same as
        # any local `bazel` invocation.
      - name: Mount Bazel cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazel-repo
          key: bazel-cache-${{ matrix.os }}-${{ hashFiles('.bazelversion', '**/MODULE.bazel') }}
          restore-keys: |
            bazel-cache-${{ matrix.os }}-
      - name: Run Bazel Unit Tests - test/unit (Starlark analysistest/unittest)
        run: |
          echo "Running Starlark unit tests for private rule/module-extension helpers"
          bazel test --test_output=errors //test/...
      - name: Run Bazel Tests - gleam_gazelle Directory (Gazelle language extension)
        run: |
          echo "Running the gleam Gazelle language extension's Go unit tests"
          bazel test --test_output=errors //gleam_gazelle/...
      - name: Verify @gleam_host//:gleam is directly runnable
        run: |
          # gleam_host_repo (gleam/private/host_repo.bzl) detects the host platform without
          # needing to know its OS/arch string; prove the resulting binary is real and matches
          # the pinned toolchain version, not just that the target resolves.
          echo "Running bazel run @gleam_host//:gleam -- --version"
          output="$(bazel run @gleam_host//:gleam -- --version)"
          echo "$output"
          echo "$output" | grep -q "gleam 1.17.0"
      - name: Verify gazelle generates a BUILD file for a fresh Gleam package
        run: |
          echo "Running bazel run //:gazelle against gleam_gazelle/testdata/sample_package (no BUILD.bazel checked in)"
          bazel run //:gazelle -- gleam_gazelle/testdata/sample_package
          generated="gleam_gazelle/testdata/sample_package/BUILD.bazel"
          want="gleam_gazelle/testdata/sample_package/BUILD.want"
          if [[ ! -f "$generated" ]]; then
            echo "ERROR: gazelle did not generate $generated" >&2
            exit 1
          fi
          # Real golden-file diff (not just a grep for a few substrings) against the same
          # BUILD.want convention gleam_gazelle's own Go golden tests use (see golden_test.go) --
          # this exercises the actual compiled gazelle_binary end-to-end, not just the Go package.
          diff -u "$want" "$generated"
          rm "$generated" # this fixture's BUILD.bazel is generated fresh by each CI run, not checked in
      - name: Run Bazel Tests - examples/gazelle_smoke Directory
        working-directory: examples/gazelle_smoke
        run: |
          echo "Running tests in examples/gazelle_smoke directory"
          bazel test --test_output=errors //...
      - name: Run Bazel Tests - examples/smoke Directory
        working-directory: examples/smoke
        run: |
          echo "Running tests in examples/smoke directory"
          bazel test --test_output=errors //...
      - name: Verify examples/smoke's //:my_app build is deterministic
        working-directory: examples/smoke
        run: |
          # `bazel clean` (not --expunge) drops the output tree so the actions genuinely
          # re-execute, while keeping already-fetched external repos (Erlang/OTP, the gleam
          # toolchain, Hex packages) so this doesn't re-download anything. Two builds of the
          # same target producing byte-different escripts would mean gleam_binary embeds
          # something nondeterministic (a timestamp, a build-machine path, map/set iteration
          # order, ...), which would silently break remote caching and bit-for-bit reproducible
          # builds for every downstream user, not just this example.
          bazel build //:my_app
          cp -L bazel-bin/my_app /tmp/my_app_build_1
          bazel clean
          bazel build //:my_app
          cp -L bazel-bin/my_app /tmp/my_app_build_2
          if ! cmp -s /tmp/my_app_build_1 /tmp/my_app_build_2; then
            echo "FAIL: two independent builds of //:my_app produced different output bytes" >&2
            cmp /tmp/my_app_build_1 /tmp/my_app_build_2 || true
            exit 1
          fi
          echo "PASS: //:my_app build is deterministic byte-for-byte across a clean rebuild"
      - name: Run Bazel Tests - examples/nested_smoke Directory
        working-directory: examples/nested_smoke
        run: |
          echo "Running tests in examples/nested_smoke directory"
          bazel test --test_output=errors //...
      - name: Run Bazel Tests - examples/web_service Directory
        working-directory: examples/web_service
        run: |
          echo "Running tests in examples/web_service directory"
          bazel test --test_output=errors //...
      - name: Verify examples/web_service's gleam_release on a fresh, Erlang-free machine (Docker)
        # GitHub's macOS runners can't run Linux containers, so this Docker-based proof only
        # runs on Linux. The build+test steps above still cover macOS; they just can't prove
        # portability to a machine that never had Erlang installed the same way Docker does.
        if: runner.os == 'Linux'
        working-directory: examples/web_service
        run: |
          # Same rationale as examples/standalone_cli: gleam_release also bundles the
          # hermetic toolchain's OTP tree now, so it should be just as portable. Prove it on
          # a genuinely fresh Docker container with no Erlang installed, not just this
          # machine with PATH tricks.
          bazel build //:web_service_bin
          rm -rf /tmp/portable_web_service
          mkdir -p /tmp/portable_web_service
          cp -L bazel-bin/web_service_bin /tmp/portable_web_service/web_service_bin
          cp -rL bazel-bin/web_service_bin.runfiles /tmp/portable_web_service/web_service_bin.runfiles

          container_id=$(docker run -d --rm -p 34817:34817 -v /tmp/portable_web_service:/artifact:ro ubuntu:24.04 /artifact/web_service_bin)
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT

          url="http://localhost:34817/"
          ready=""
          # A freshly pulled container plus a cold Erlang/OTP VM boot reading BEAM files off a
          # bind-mounted volume can take noticeably longer than a warm, same-machine start --
          # give it up to a minute rather than the few seconds that's plenty outside Docker.
          for _ in $(seq 1 120); do
            if response="$(curl -sf --max-time 1 "$url")"; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [[ -z "$ready" ]]; then
            echo "FAIL: server never became ready on $url" >&2
            docker logs "$container_id" || true
            exit 1
          fi

          expected="Hello from web_service!"
          if [[ "$response" != "$expected" ]]; then
            echo "FAIL: expected response body '$expected', got '$response'" >&2
            exit 1
          fi
          echo "PASS: got expected response from a container with no Erlang installed: $response"
      - name: Run Bazel Tests - examples/hermetic_erlang Directory
        working-directory: examples/hermetic_erlang
        run: |
          echo "Running tests in examples/hermetic_erlang directory"
          bazel test --test_output=errors //...
      - name: Run Bazel Build - examples/expect_fail Directory
        working-directory: examples/expect_fail
        run: |
          echo "Building examples/expect_fail directory"
          bazel build //...
      - name: Verify gleam_test/gleam_format_test detect real failures (examples/expect_fail)
        working-directory: examples/expect_fail
        run: |
          # Every other example only shows the happy path. These two targets are deliberately
          # broken (see examples/expect_fail/README.md), so `bazel test` on them must fail --
          # if either one unexpectedly passes, gleam_test/gleam_format_test have stopped
          # actually detecting failures, which every other example in this repo would miss.
          if bazel test --test_output=errors //:expect_fail_test; then
            echo "FAIL: //:expect_fail_test is deliberately broken but bazel test reported success" >&2
            exit 1
          fi
          if bazel test --test_output=errors //:expect_fail_format_test; then
            echo "FAIL: //:expect_fail_format_test is deliberately misformatted but bazel test reported success" >&2
            exit 1
          fi
          echo "PASS: gleam_test and gleam_format_test both correctly detected their intentionally-broken fixtures"
      - name: Run Bazel Build - examples/hello_world Directory
        working-directory: examples/hello_world
        run: |
          echo "Building examples/hello_world directory"
          bazel build //...
          # The escript's shebang (`#!/usr/bin/env escript`) looks up `escript` on PATH at run
          # time, separately from whichever Erlang/OTP built it -- since Erlang is hermetic by
          # default now, that's the downloaded OTP, not the system one the "Set up Erlang" step
          # installs (only needed by examples/nested_smoke's explicit PATH-based opt-out).
          # Prepend the hermetic toolchain's own bin/ so the versions actually match.
          hermetic_bin="$(bazel info output_base)/external/muchq_rules_gleam++gleam+local_config_erlang/otp/bin"
          if [[ -d "$hermetic_bin" ]]; then
            export PATH="$hermetic_bin:$PATH"
          fi
          # Verify the binary is executable and runs
          ./bazel-bin/hello_world
      - name: Run Bazel Build - examples/standalone_cli Directory
        working-directory: examples/standalone_cli
        run: |
          echo "Building examples/standalone_cli directory"
          bazel build //...
      - name: Verify examples/standalone_cli on a fresh, Erlang-free machine (Docker)
        # Same rationale as examples/web_service's Docker step above: not available on macOS.
        if: runner.os == 'Linux'
        working-directory: examples/standalone_cli
        run: |
          # A same-machine PATH trick can't fully rule out accidentally finding a system
          # Erlang; copy the *actual* build output onto a genuinely fresh Docker container
          # that never had Erlang installed at all, dereferencing every runfiles symlink
          # (cp -L) into real files first, so the copy has no dependency on this machine's
          # Bazel cache either.
          rm -rf /tmp/portable_standalone_cli
          mkdir -p /tmp/portable_standalone_cli
          cp -L bazel-bin/standalone_cli /tmp/portable_standalone_cli/standalone_cli
          cp -rL bazel-bin/standalone_cli.runfiles /tmp/portable_standalone_cli/standalone_cli.runfiles
          output=$(docker run --rm -v /tmp/portable_standalone_cli:/artifact:ro ubuntu:24.04 /artifact/standalone_cli)
          echo "$output"
          echo "$output" | grep -q "Hello from a standalone release with no host Erlang required!"
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pre-commit/action@v3.0.1
  conclusion:
    name: Test Conclusion
    needs: [test, pre-commit] # Depends on the matrix job 'test' and 'pre-commit'
    runs-on: ubuntu-latest
    if: always() # Ensures this job runs even if matrix jobs fail
    steps:
      - name: Check workflow conclusion
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job failed, cancelled, or skipped: ${{ needs.test.result }}"
            exit 1
          fi
          if [[ "${{ needs.pre-commit.result }}" != "success" ]]; then
            echo "Pre-commit job failed, cancelled, or skipped: ${{ needs.pre-commit.result }}"
            exit 1
          fi
          echo "All tests passed successfully!"
